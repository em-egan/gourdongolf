<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOURDON — SS 2026</title>
<meta name="description" content="GOURDON. SS 2026 coming soon. Three lengths. One perfect fit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --grey-1:#DCDFDD;
    --grey-2:#C4C9C6;
    --ink:#101F38;
    --soft:#6E7783;
    --green:#1C3B31;
    --panel:#F2F3F1;
    --ghost:#C9CDCA;   /* faded wordmark */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100svh;
    background:#fff;
    color:var(--ink);
    font-family:"Inter",-apple-system,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:clamp(24px,5vw,64px);
  }
  .wrap{max-width:1500px;margin:0 auto}

  /* ---------- centred header ---------- */
  header{text-align:center;padding:clamp(24px,4vw,48px) 0 clamp(48px,7vw,96px)}
  .eyebrow{
    font-family:"Inter",Arial,sans-serif;
    font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--soft);
  }
  .wordmark{
    display:block;
    width:clamp(220px,42vw,520px);   /* logo width — adjust to taste */
    height:auto;
    margin:clamp(14px,2vw,22px) auto;
    /* fade-in on load */
    opacity:0;
    animation:fade 1.1s cubic-bezier(.2,.75,.2,1) .15s forwards;
  }
  .place{
    font-family:"Inter",Arial,sans-serif;
    font-size:12px;letter-spacing:.30em;text-transform:uppercase;color:var(--ink);
  }

  /* ---------- two-column body ---------- */
  .grid{
    display:grid;
    grid-template-columns:0.92fr 1.08fr;
    gap:clamp(32px,6vw,90px);
    align-items:center;
  }

  /* image card — asymmetric rounded corners (sharp top-right) */
  .visual{
    position:relative;
    aspect-ratio:4/5;
    overflow:hidden;
    background:radial-gradient(120% 90% at 50% 22%, #E6E8E6 0%, var(--grey-1) 45%, var(--grey-2) 100%);
    opacity:0;animation:fade .9s ease .5s forwards;
  }
  .visual img{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;object-position:center top;
    display:block;
  }
  @keyframes fade{to{opacity:1}}

  /* ---------- first access panel ---------- */
  .panel{
    background:var(--panel);
    padding:clamp(28px,3.4vw,52px);
    opacity:0;animation:fade .9s ease .75s forwards;
  }
  .cap{
    font-family:"Inter",Arial,sans-serif;
    font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--soft);
    margin-bottom:22px;
  }
  .field{display:flex;align-items:center;border-bottom:1px solid rgba(16,31,56,.35)}
  input[type=email]{
    flex:1;background:none;border:0;padding:12px 0;color:var(--ink);
    font-family:inherit;font-size:clamp(16px,1.5vw,19px);
  }
  input::placeholder{color:var(--soft)}
  input:focus{outline:none}
  .field:focus-within{border-color:var(--green)}
  button{
    background:none;border:0;cursor:pointer;color:var(--green);
    font-family:"Archivo",Arial,sans-serif;font-weight:600;
    font-size:12px;letter-spacing:.2em;text-transform:uppercase;
    padding:12px 0 12px 22px;white-space:nowrap;
  }
  button:hover{color:var(--ink)}
  .note{font-size:14px;color:var(--soft);margin-top:16px}
  .msg{font-size:14px;color:var(--green);margin-top:16px;display:none}
  .msg.show{display:block}
  .foot{font-size:13px;color:var(--soft);line-height:1.7;margin-top:34px}
  .foot a{color:var(--ink);text-decoration:none;border-bottom:1px solid rgba(16,31,56,.28)}
  .foot a:hover{color:var(--green)}
  :focus-visible{outline:2px solid var(--green);outline-offset:3px}

  @media (prefers-reduced-motion:reduce){
    .wordmark,.visual,.panel{animation:none;opacity:1}
  }
  @media(max-width:860px){
    .grid{grid-template-columns:1fr;gap:clamp(28px,7vw,44px)}
    .visual{max-width:420px;margin:0 auto;width:100%;border-radius:96px 0 96px 96px}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">Coming soon</div>
      <!-- Logo. Replace src with your file (SVG preferred, or transparent PNG). -->
      <img class="wordmark" src="https://raw.githubusercontent.com/em-egan/gourdongolf/392b1fc9d3e0cbbbff00b9a69cd01951b51eb7b3/logo.svg?token=BBRJQRZIUNIMDFICVXXXPTDKMP4T2" alt="GOURDON">
      <div class="place">Melbourne, Australia</div>
    </header>

    <div class="grid">
      <!-- LEFT: campaign image.
           Replace src with your shot (portrait, ~4:5). Grey backdrop shows if it doesn't load. -->
      <div class="visual">
        <img src="https://raw.githubusercontent.com/em-egan/gourdongolf/ddbfcb919a627c68b23045f06383a124aa986799/main_image.svg?token=BBRJQR2PHZ2WHXPSI3BGKP3KMP42O" alt="GOURDON SS 2026"
             onerror="this.style.display='none'">
      </div>

      <!-- RIGHT: first access panel -->
      <div class="panel">
        <form novalidate>
          <div class="cap">First access to SS 2026</div>
          <div class="field">
            <label for="email" style="position:absolute;left:-9999px">Email address</label>
            <input id="email" type="email" placeholder="Email address" required>
            <button type="submit">Join the list</button>
          </div>
          <p class="note">One email when the collection opens.</p>
          <p class="msg" id="msg">You're on the list.</p>
        </form>

        <p class="foot">
          Pro shop and wholesale enquiries<br>
          <a href="mailto:hello@gourdongolf.au">hello@gourdongolf.au</a>
        </p>
      </div>
    </div>
  </div>

<script>
  document.querySelector('form').addEventListener('submit',function(ev){
    ev.preventDefault();
    var i=document.getElementById('email');
    if(!i.checkValidity()||!i.value){i.focus();return;}
    // Wire this to Klaviyo / Shopify / Mailchimp
    document.getElementById('msg').classList.add('show');
    i.value='';i.blur();
  });
</script>
</body>
</html>
